<main class="contenedor-login">

  <section class="presentacion">

    <div class="espacio-foto">
      <img src="https://i.pinimg.com/originals/80/99/8e/80998e5a0f649081d158492ac83d70ca.jpg"
           alt="Imagen de presentación">
    </div>

    <h1>Bienvenido a nuestra página</h1>
    <p>
      Regístrate para disfrutar de todo
      nuestro contenido.
    </p>

    <div class="galeria">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcQJN8EsPH1t1sG59217FE6MA3Q13tihTFQM_KGMFtFqSH5LEpSXtmvtz_&s=10" alt="https://i.pinimg.com/originals/80/99/8e/80998e5a0f649081d158492ac83d70ca.jpg">
      <img src="https://tse3.mm.bing.net/th/id/OIF.OgDOXpmZLL3ANwTnJJQ6Ow?r=0&rs=1&pid=ImgDetMain&o=7&rm=3n" alt="https://tse3.mm.bing.net/th/id/OIF.OgDOXpmZLL3ANwTnJJQ6Ow?r=0&rs=1&pid=ImgDetMain&o=7&rm=3n">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxFfF53XbBbspJav4A38mowz5CcgG7P8_wP6CvH8aO8Tl7YvVPXoN-aW8&s=10" alt="Foto 3">
    </div>

  </section>

  <section class="formulario">

    <div class="caja-login">

      <h2>
        {{ vista === 'login'
        ? 'Iniciar sesión'
        : 'Crear cuenta' }}
      </h2>

      <p class="subtitulo">
        Debes tener una cuenta para entrar.
      </p>

      <form *ngIf="vista === 'login'"
            (ngSubmit)="iniciarSesion()">

        <label>Usuario</label>
        <input type="text"
               name="usuarioLogin"
               [(ngModel)]="usuario"
               placeholder="Ingresa tu usuario"
               required>

        <label>Contraseña</label>
        <input type="password"
               name="passwordLogin"
               [(ngModel)]="password"
               placeholder="Ingresa tu contraseña"
               required>

        <button type="submit"
                [disabled]="cargando">
          Iniciar sesión
        </button>

        <p class="cambiar">
          ¿No tienes cuenta?
          <a (click)="cambiarVista('registro')">
            Regístrate aquí
          </a>
        </p>

      </form>

      <form *ngIf="vista === 'registro'"
            (ngSubmit)="registrarse()">

        <label>Nombre de usuario</label>
        <input type="text"
               name="usuario"
               [(ngModel)]="usuario"
               placeholder="Tu nombre"
               required>

        <label>Contraseña</label>
        <input type="password"
               name="passwordRegistro"
               [(ngModel)]="password"
               placeholder="Crea una contraseña"
               required>

        <label>Confirmar contraseña</label>
        <input type="password"
               name="confirmar"
               [(ngModel)]="confirmarPassword"
               placeholder="Repite tu contraseña"
               required>

        <button type="submit"
                [disabled]="cargando">
          Crear cuenta
        </button>

        <p class="cambiar">
          ¿Ya tienes cuenta?
          <a (click)="cambiarVista('login')">
            Inicia sesión
          </a>
        </p>

      </form>

      <p class="mensaje" *ngIf="mensaje">
        {{ mensaje }}
      </p>

    </div>

  </section>

</main>
