<h2>Productos</h2>
<p>{{ mensaje }}</p>

<table border="1">
  <tr>
    <th>Nombre</th><th>Tipo</th><th>Disponible</th><th>Precio</th><th>Imagen</th><th>Comprar</th>
  </tr>
  <tr *ngFor="let p of productos">
    <td>{{ p.nombreProducto }}</td>
    <td>{{ p.tipoProducto }}</td>
    <td>{{ p.cantidad }}</td>
    <td>{{ p.precio }}</td>
    <td>{{ p.urlImagen }}</td>
    <td>
      <input type="number" [(ngModel)]="p.aComprar">
      <button (click)="comprar(p)">Comprar</button>
    </td>
  </tr>
</table>
